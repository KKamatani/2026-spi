fukasawa:
  name: "深澤 正彰"
  affiliation: "大阪大学"
  profile: "https://www.sigmath.es.osaka-u.ac.jp/~fukasawa/"
  title: "ボラティリティ・モデリングの最近の展開"
  abstract: |
    資産価格過程の確率ボラティリティ・モデリングについて最近の話題と課題を共有する。ボラティリティの長期記憶性、ラフ性、1/fノイズとの関係や、オプション価格データ解析の数理を概観する。
kamatani:
  name: "鎌谷 研吾"
  affiliation: "統計数理研究所"
  profile: "https://kkamatani.github.io/"
  title: "区分確定的マルコフ過程のエルゴード性"
  abstract: |
    区分確定的マルコフ過程のエルゴード性に関する新しい結果を紹介する．
shimizu:
  name: "清水 泰隆"
  affiliation: "早稲田大学"
  profile: "https://www.shimizu.sci.waseda.ac.jp/ys/"
  title: "Generalized survival energy models with exogenous covariates for mortality prediction"
  abstract:  |
    通常の生命エネルギーモデル（Surivial Energy Model, SEM）では，（仮想的な）生命エネルギーを表す確率過程がゼロに達する時刻を死亡時刻とみなして，その初期到達時刻の分布を推定する．本講演では，初期エネルギーを確率変数とし，さらに経済・医療などの環境変数を過程の係数に取り入れた一般化生命エネルギーモデル（GSEM）を紹介する．この枠組みから，環境経路に条件付けた死亡時刻の初到達分布を構成し，これらの予測精度を実証する．日本の男女別コホート死亡データを用いた実証では，GDPや医師密度などの環境データを導入して，既存のLee-Carterモデル，CBD系モデルM6・M7と予測性能を比較する．また，初期値の個人差と環境依存を同じ確率過程の枠組みに組み込むことの意義と，その推測・予測上の限界，長寿リスク等への応用可能性について議論する．
uchida:
  name: "内田 雅之"
  affiliation: "大阪大学・東京大学"
  profile: "https://sites.google.com/view/masayukiuchida/"
  title: "微小撹乱パラメータをもつ2次元空間の2階線形放物型SPDEのパラメータ推定"
  abstract: |
    未知の減衰パラメータをもつQ-ブラウン運動で駆動される、微小撹乱パラメータを含む2次元空間の2階線形放物型確率偏微分方程式（SPDE）を対象とし、その係数パラメータの推定問題を考察する。まず、対象となるSPDEに従う高頻度時空間データから時空間増分(triple increments)を構成し、未知の減衰パラメータの推定量を提案する。次に、この推定量を用いて拡散パラメータおよび移流パラメータに対するコントラスト関数を構成し、それらの最小コントラスト推定量を導出する。さらに、得られた拡散・移流パラメータの推定量を用いて座標過程を近似し、その近似座標過程に基づく反応パラメータの擬似最尤推定量を構成する。これらの推定量の漸近的性質を明らかにするとともに、数値シミュレーションを通じて、その漸近挙動を検証する。本研究は渡名喜庸蔵氏（大阪大学大学院基礎工学研究科）および貝野友祐氏（神戸大学大学院海事科学研究科）との共同研究である。
koike:
  name: "小池 祐太"
  affiliation: "東京大学"
  profile: "https://www.ms.u-tokyo.ac.jp/~kyuta/"
  title: "拡散モデルのサンプリング誤差解析"
  abstract: |
    拡散モデルは、訓練データに徐々にノイズを加えてほぼ完全なノイズに変換する過程を逆向きに辿る方法を学習することで、完全なノイズから訓練データと似た分布に従うデータを生成する方法である。画像生成において同様のタスクを実行する方法として、敵対的生成ネットワーク(GAN)や変分オートエンコーダー(VAE)などがあるが、これらの既存の手法と比較して、拡散モデルは生成されるデータの質や多様性の点で優れていることが実証的に示されている。他方、学習済みの拡散モデルから新規にデータを生成する際には反復計算が必要であり、計算コストが高いという難点がある。そのため、拡散モデルから新規に生成されたデータの分布が、反復計算の回数に応じて、学習元データの分布とどの程度乖離するかを評価する問題(サンプリング誤差解析)は重要な課題である。本講演では、この問題の最近の進展と課題について、講演者が得た結果を中心に報告する. 
ogihara:
  name: "荻原 哲平"
  affiliation: "東京大学"
  profile: "https://sites.google.com/site/homepageofteppeiogihara/"
  title: "ニューラルネットワークによるLévy駆動SDEのドリフト推定"
  abstract: |
    多次元Lévy駆動確率微分方程式を離散観測するモデルで，Schmidt-Hieber (2020)やOga and Koike (2024)の理論を拡張し，ニューラルネットワークによる最小二乗法でドリフト関数をノンパラメトリック推定する非漸近理論を構築する．exponential β mixingとLévy測度の指数減衰条件の下で，推定量に対するオラクル不等式を導出する．分布のsub-Gauss性と連続マルチンゲールの枠組みを用いていた先行研究と異なり，ジャンプ成分により連続マルチンゲールの枠組みは崩れ，経験過程の揺らぎもsub-exponential型へ変わる．本研究ではcompensated Poisson積分に対する指数優マルチンゲール評価とOrlicz normに対するmaximal inequalitiesによりこの課題に対処する．結果として，定数倍を除き拡散過程の場合と同程度の統計的上界が得られ，階層的合成構造をもつドリフトでは内在次元に応じた収束率が従う．
    本研究は東京大学 野口泰正氏との共同研究である．
masuda:
  name: "増田 弘毅"
  affiliation: "東京大学"
  profile: "https://www.ms.u-tokyo.ac.jp/~hmasuda/hmhp.html"
  title: "擬似尤度の摂動について"
  abstract: |
    高頻度観測のもとで、擬似尤度関数を摂動することにより局外要素の影響を抑制する手法を提案する。具体的には、有限活動型のジャンプを持つ拡散過程モデルを対象に、ジャンプ部分の構造を特定することなく拡散係数を推定できる手法を示す。閾値推定などのいわゆるカットオフ型の手法とは異なり、提案手法ではチューニングパラメータの選択範囲が実質的に有界区間 (0,1] に限られるため、チューニングパラメータに対する推定値の挙動を示すシグニチャープロットも容易に描ける。また、ジャンプがない場合の効率損失も小さい。さらに、同様の手法を他のモデル設定へ適用した数値実験の結果についても紹介する。本講演の主要部分は、江口翔一氏（大阪工業大学）との最近の共同研究に基づく。
yoshida:
  name: "吉田 朋広"
  affiliation: "東京大学"
  profile: "https://www.ms.u-tokyo.ac.jp/~nakahiro/index.htm"
  title: "リスク比較定理と拡散行列の深層学習への応用"
  abstract: |
    多次元かつ強混合性（strong mixing）を持つ共変量過程を含む確率微分方程式において、拡散行列のノンパラメトリック推定について検討する。我々は、線形基底による表現を必要としない、一般的な関数クラスに基づく柔軟な統計的枠組みを提案する。この枠組みにより、本研究の成果は深層ニューラルネットワークを用いた推定器にも直接適用可能となる。提案手法は2段階の推定手順から構成される。まず予備的なノンパラメトリック擬似尤度推定器を構築し、続いてβヘルダー（β-Hölder）クラスによる近似を用いて正則化を行う。また、対象となる確率過程の特定の確率構造に依存することなく、任意の推定器における経験リスクと汎関数リスク（汎化リスク）を比較するための一般的な定理を確立する。時間区間 $[0, T]$ における $n+1$ 個の観測値を用いた拡散行列の学習において、導出された誤差の上界は、共変量過程のミキシングに関連する $T$ に依存する収束レートと、ボラティリティ推定を支配する $n$ に依存する収束レートとの間の本質的な相互関係を捉えている。本発表はA. Gloter教授との共同研究によっている．
