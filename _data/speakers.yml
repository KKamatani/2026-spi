fukasawa:
  name: "深澤 正彰"
  affiliation: "大阪大学"
  profile: "https://www.sigmath.es.osaka-u.ac.jp/~fukasawa/"
  title: "ボラティリティ・モデリングの最近の展開"
  abstract: "資産価格過程の確率ボラティリティ・モデリングについて最近の話題と課題を共有する。ボラティリティの長期記憶性、ラフ性、1/fノイズとの関係や、オプション価格データ解析の数理を概観する。"
kamatani:
  name: "鎌谷 研吾"
  affiliation: "統計数理研究所"
  profile: "https://kkamatani.github.io/"
  title: "区分確定的マルコフ過程のエルゴード性"
  abstract: "区分確定的マルコフ過程のエルゴード性に関する新しい結果を紹介する．"
shimizu:
  name: "清水 泰隆"
  affiliation: "早稲田大学"
  profile: "https://www.shimizu.sci.waseda.ac.jp/ys/"
  title: "Generalized survival energy models with exogenous covariates for mortality prediction"
  abstract: "通常の生命エネルギーモデル（Surivial Energy Model, SEM）では，（仮想的な）生命エネルギーを表す確率過程がゼロに達する時刻を死亡時刻とみなして，その初期到達時刻の分布を推定する．本講演では，初期エネルギーを確率変数とし，さらに経済・医療などの環境変数を過程の係数に取り入れた一般化生命エネルギーモデル（GSEM）を紹介する．この枠組みから，環境経路に条件付けた死亡時刻の初到達分布を構成し，これらの予測精度を実証する．日本の男女別コホート死亡データを用いた実証では，GDPや医師密度などの環境データを導入して，既存のLee-Carterモデル，CBD系モデルM6・M7と予測性能を比較する．また，初期値の個人差と環境依存を同じ確率過程の枠組みに組み込むことの意義と，その推測・予測上の限界，長寿リスク等への応用可能性について議論する．"
