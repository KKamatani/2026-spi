ogihara:
  name: "荻原 哲平"
  affiliation: "東京大学"
  profile: "https://sites.google.com/site/homepageofteppeiogihara/"
  title: "ニューラルネットワークによるLévy駆動SDEのドリフト推定"
  abstract: |
    多次元Lévy駆動確率微分方程式を離散観測するモデルで，Schmidt-Hieber (2020)やOga and Koike (2024)の理論を拡張し，ニューラルネットワークによる最小二乗法でドリフト関数をノンパラメトリック推定する非漸近理論を構築する．exponential β mixingとLévy測度の指数減衰条件の下で，推定量に対するオラクル不等式を導出する．分布のsub-Gauss性と連続マルチンゲールの枠組みを用いていた先行研究と異なり，ジャンプ成分により連続マルチンゲールの枠組みは崩れ，経験過程の揺らぎもsub-exponential型へ変わる．本研究ではcompensated Poisson積分に対する指数優マルチンゲール評価とOrlicz normに対するmaximal inequalitiesによりこの課題に対処する．結果として，定数倍を除き拡散過程の場合と同程度の統計的上界が得られ，階層的合成構造をもつドリフトでは内在次元に応じた収束率が従う．
    本研究は東京大学 野口泰正氏との共同研究である．
