fukasawa:
  name: "深澤 正彰"
  affiliation: "大阪大学"
  profile: "https://www.sigmath.es.osaka-u.ac.jp/~fukasawa/"
  title: "ボラティリティ・モデリングの最近の展開"
  abstract: |
    資産価格過程の確率ボラティリティ・モデリングについて最近の話題と課題を共有する。ボラティリティの長期記憶性、ラフ性、1/fノイズとの関係や、オプション価格データ解析の数理を概観する。
kamatani:
  name: "鎌谷 研吾"
  affiliation: "統計数理研究所"
  profile: "https://kkamatani.github.io/"
  title: "区分確定的マルコフ過程のエルゴード性"
  abstract: |
    区分確定的マルコフ過程のエルゴード性に関する新しい結果を紹介する．
shimizu:
  name: "清水 泰隆"
  affiliation: "早稲田大学"
  profile: "https://www.shimizu.sci.waseda.ac.jp/ys/"
  title: "Generalized survival energy models with exogenous covariates for mortality prediction"
  abstract:  |
    通常の生命エネルギーモデル（Surivial Energy Model, SEM）では，（仮想的な）生命エネルギーを表す確率過程がゼロに達する時刻を死亡時刻とみなして，その初期到達時刻の分布を推定する．本講演では，初期エネルギーを確率変数とし，さらに経済・医療などの環境変数を過程の係数に取り入れた一般化生命エネルギーモデル（GSEM）を紹介する．この枠組みから，環境経路に条件付けた死亡時刻の初到達分布を構成し，これらの予測精度を実証する．日本の男女別コホート死亡データを用いた実証では，GDPや医師密度などの環境データを導入して，既存のLee-Carterモデル，CBD系モデルM6・M7と予測性能を比較する．また，初期値の個人差と環境依存を同じ確率過程の枠組みに組み込むことの意義と，その推測・予測上の限界，長寿リスク等への応用可能性について議論する．
uchida:
  name: "内田 雅之"
  affiliation: "大阪大学・東京大学"
  profile: "https://sites.google.com/view/masayukiuchida/"
  title: "微小撹乱パラメータをもつ2次元空間の2階線形放物型SPDEのパラメータ推定"
  abstract: |
    未知の減衰パラメータをもつQ-ブラウン運動で駆動される、微小撹乱パラメータを含む2次元空間の2階線形放物型確率偏微分方程式（SPDE）を対象とし、その係数パラメータの推定問題を考察する。まず、対象となるSPDEに従う高頻度時空間データから時空間増分(triple increments)を構成し、未知の減衰パラメータの推定量を提案する。次に、この推定量を用いて拡散パラメータおよび移流パラメータに対するコントラスト関数を構成し、それらの最小コントラスト推定量を導出する。さらに、得られた拡散・移流パラメータの推定量を用いて座標過程を近似し、その近似座標過程に基づく反応パラメータの擬似最尤推定量を構成する。これらの推定量の漸近的性質を明らかにするとともに、数値シミュレーションを通じて、その漸近挙動を検証する。本研究は渡名喜庸蔵氏（大阪大学大学院基礎工学研究科）および貝野友祐氏（神戸大学大学院海事科学研究科）との共同研究である。
